<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Responsive</title>
</head>
<body>

<aside class="sidebar d-none d-md-block">
  <div class="logo mt-3">
    <img src="/assets/images/icones/billy-ecole.jpg" class="rounded-circle mx-auto d-block" alt="Logo Billy-ecole">
    <span class="titleL text-uppercase mt-2 ">Billy ecole</span>
    <div class="text-center text-rouge">La puissance de l'excellence</div>
  </div>
  <div class="separateur mt-2"></div>
  <div class="scrollerCont">
  <a  routerLink="/admin/tableaudebord"
    routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: true }">
    <i class="fa fa-home icon-rouge"></i> Tableau de bord
  </a>

    <!-- sidemenu -->
    <!-- Ci-dessous Gestion des Eleves -->
    <a  routerLink="/admin/listeDesElevesC"  class=""
    routerLinkActive="active-link">
    <i class="fa fa-user-graduate icon-vert" ></i> Liste génerale des Elèves
  </a>

    <!-- End gestion eleves -->

    <!-- Ci-dessous Gestion des Personnels -->
    <a class="dropdown-toggle" data-bs-toggle="collapse"
      href="#gestionPersonnels"
      role="button" aria-expanded="false"
      aria-controls="gestionPersonnels"
    > <i class="fa fa-users icon-rouge"></i> Gestion des Personnels
    </a>
    <!-- Ci-dessous contenu Gestion des personnels -->
      <div class="collapse submenu" id="gestionPersonnels">
        <ul>
          <li *ngFor="let route1 of  data_submenu_personnels">
            <a [routerLink]="[route1?.path]"
             routerLinkActive="active-link">{{route1.name}}
           </a>
          </li>
        </ul>

      </div>
    <!-- End gestion des personnels -->


 

      <!-- Ci-dessous Gestion des Rapport -->
      <a  routerLink="/admin/gestionRapports"  class=""
       routerLinkActive="active-link">
      <i class="fas  fa-chart-bar icon-rouge"></i> Gestion des Rapports
      </a>
    <!-- Ci-dessous contenu Gestion Rapport  -->

     <!-- Ci-dessous Gestion des Configuration -->
     <a class="dropdown-toggle d-blocke d-lg-nonee" data-bs-toggle="collapse"
     href="#gestionConfiguration"
     role="button" aria-expanded="false"
     aria-controls="gestionConfiguration"
     > <i class="fa fa-gear icon-vert"></i> Configuration
     </a>
   <!-- Ci-dessous contenu Gestion Configuration  -->
   <div class="collapse submenu" id="gestionConfiguration">
     <ul>
       <li *ngFor="let route4 of  data_submenu_Configuration">
         <a [routerLink]="[route4?.path]"
          routerLinkActive="active-link">
          {{route4.name}}
         </a>
       </li>
     </ul>
   </div>
   <!-- End gestion Configuration  -->

     <!-- Ci-dessous Gestion des Supervision -->
     <a routerLink="/admin/statistiqueSupervision"
     routerLinkActive="active-link">
      <i class="fa-solid fa-briefcase icon-rouge"></i> Supervision
    </a>
   <!-- End gestion Supervision  -->



  </div>
</aside>

</body>
</html>
