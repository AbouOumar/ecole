<div class="container" style="margin-top: 5rem;">
  <h3 class="pt-3">Notation de l'élève</h3>
</div>
<div class="container bg-light ms-smPas">

  <div class="row">
    <div class="col-6 col-md-3  ">
      <select [(ngModel)]="selectedAnneeId" name="annee" id="annee" class="form-select rounded-5  mt-3">
        <option  value={{annee.id}} *ngFor="let annee of annees">{{annee.dateDebut|date:'yyyy'}} - {{annee.DateFin|date:'yyyy'}}</option>
        </select>
    </div>

    <div class="col-6 col-md-3 ">
      <select [(ngModel)]="selectedSemestre" name="semestre" id="semestre" class="form-select rounded-5  mt-3">
        <option value="">Choisir le semestre</option>
        <option value=1>Semestre 1</option>
        <option value=2>Semestre 2</option>
        </select>
    </div>



    <div class="col-6 col-md-3 ">
      <select [(ngModel)]="selectedMatiere" (change)="chargerNotesMatiereClasse()"  id="maListe" class="form-select rounded-5   mt-3  fs-sm " name="selectedMatiere">
        <option value="">-- Choisir la matiere --</option>
        <option *ngFor="let matiere of matieres"  value="{{matiere.id}}">{{matiere.libelle_matiere}}</option>
      </select>
    </div>

    <div class="col-6 col-md-3 ">
      <select [(ngModel)]="selectedClasseId" (change)="chargerNotesMatiereClasse()"  id="maListe" class="form-select rounded-5   mt-3  fs-sm " name="selectedClasseId">
        <option value="">-- Choisir la classe --</option>
        <option *ngFor="let classe of classes" value="{{classe.classe.id}}">{{classe.classe.nom_classe}}</option>
      </select>
    </div>

  </div>



<div class="row mt-3 flex js mt-5">
      <div class="col-6 col-md-4">
        <div class="form-group mb-3">
          <label for="moisSelect">Filtrer par mois :</label>
          <select id="moisSelect" class="form-select rounded-5 rounded-4 p-2 " [(ngModel)]="moisSelectionne">
            <option value="Tous">Tous les mois</option>
            <option *ngFor="let mois of moisSemestre" [value]="mois.nomMois">{{ mois.nomMois | titlecase }}</option>
          </select>
        </div>
    </div>
    <div *ngIf="notes.length >0" class="col-6 col-md-4">
      <div class="form-group mb-3">
        <label for="eleve">Filtrer élève :</label>
        <input type="search" id="eleve" class="form-control rounded-4 p-2 " placeholder="Rechercher un élève"
        [(ngModel)]="textRecherche" name="textRecherche"
        >
      </div>
  </div>
</div>



  <div *ngIf="notes.length >0" class="table-responsive  mt-3">
        <table class="table table-bordered w-100">
          <thead class="text-center">
            <tr>
              <th>Matricule</th>
              <th>Nom complet</th>
              <ng-container *ngFor="let mois of moisSemestre ; let k=index">
                <th *ngIf="(moisSelectionne == 'Tous' || moisSelectionne == mois.nomMois) && (k+1 != 4)">
                  {{ mois.nomMois | titlecase }}<br><small>Orale / Écrit</small>
                </th>
              </ng-container>
              <th *ngIf="(moisSemestre.length > 3) && (moisSelectionne == 'Tous' || moisSelectionne == moisSemestre[3].nomMois)">
                {{ moisSemestre[3]?.nomMois }}<br>Composition
             </th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let eleve of notes|filtreNote:textRecherche; let i=index">
              <td>{{ eleve.matricule_eleve }}</td>
              <td style="min-height: 1px;">{{ eleve.prenom_eleve }} {{ eleve.nom_eleve }}</td>

              <ng-container *ngFor="let note of eleve.notes; let j=index">
                <td *ngIf="(moisSelectionne == 'Tous' || moisSelectionne == note.mois.nomMois) && (j+1 != 4)">
                  <input [(ngModel)]="note.orale"
                  (blur)="enregistrerNote(note, 'orale',note.mois.nomMois, eleve.id)"
                  type="number" min="0" max="20" value="{{ note.orale}}" name="{{eleve.id}}noteoralenote{{note.mois.nomMois}}"
                  style="padding:1px 5px;"
                  >

                  <input [(ngModel)]="note.ecrit"
                  (blur)="enregistrerNote(note, 'ecrit',note.mois.nomMois, eleve.id)"
                  type="number" min="0" max="20" class="ms-3 " value="{{ note.ecrit}}" name="{{eleve.id}}noteecrit{{note.mois.nomMois}}"
                    style="padding:1px 5px;"
                  >
                </td>
              </ng-container>

              <td *ngIf="(eleve.notes.length > 3) && (moisSelectionne == 'Tous' || moisSelectionne == eleve.notes[3]?.mois?.nomMois)">
                <input type="number"
                [(ngModel)]="eleve.notes[3].compo"
                (blur)="enregistrerNote(eleve.notes[3], 'compo',eleve.notes[3].mois.nomMois, eleve.id)"
                min="0" max="20" [value]="eleve.notes[3]?.compo" name="{{eleve.id}}noteCompo">
             </td>

            </tr>
          </tbody>
        </table>
      <nav>
        <ul class="pagination justify-content-center">
            <li class="page-item disabled">
                <a class="page-link" style="background-color: #fff;">&laquo;</a>
            </li>
            <li class="page-item" style="background-color: #2ecc71;">
                <a class="page-link" style="background-color: #fff;">1</a>
            </li>
            <li class="page-item active" style="background-color: #2ecc71;">
                <a class="page-link" style="background-color: #2ecc71;">2</a>
            </li>
            <li class="page-item" style="background-color: #fff;">
                <a class="page-link" style="background-color: #fff;">3</a>
            </li>
            <li class="page-item">
                <a class="page-link" style="background-color: #fff;">&raquo;</a>
            </li>
        </ul>
    </nav>
  </div>

</div>
