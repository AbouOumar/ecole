
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
  <div class="login-page ">
    <div class="login-card">
      <img src="/assets/images/icones/billy-ecole.jpg" class="rounded-circle mx-auto" width="100" height="100" alt="Logo Billy-ecole">
      <h4 class="text-center"><strong>Connexion à Billy École</strong></h4>
      <form (ngSubmit)="onLogin()" class="mt-">
        <div class="form-group">
          <label for="email">Adresse Email</label>
          <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="ex: user@example.com" />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="••••••••" />
        </div>

        <div *ngIf="loginError" class="error">
          {{ loginError }}
        </div>

        <div class="form-check">
          <input type="checkbox" id="rememberMe" class="form-check-input" />
          <label for="rememberMe">Se souvenir de moi</label>
        </div>

        <button type="submit" class="btn">Se connecter</button>
      </form>
      <p class="footer-text">Pas encore de compte ? <span class="text-black"> Veuillez consulter la direction</span></p>
      <!-- <p class="footer-text">Pas encore de compte ? <a routerLink="/signUpPas">Veuillez consulter la direction</a></p> -->
    </div>

    <div class="login-cardPas d-nonee d-md-blocke">
      <img src="/assets/images/imgLogin/img-login.jpeg" class="rounded-circlee mx-autoe" width="430" height="" alt="Logo Billy-ecole">
     </div>


  </div>
</body>
</html>
