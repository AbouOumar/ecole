

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card mt-5">
        <div class="card-header text-center">
          <h4>Créer un compte</h4>
        </div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label for="fullName" class="form-label">Nom complet</label>
              <input type="text" class="form-control" id="fullName" placeholder="Votre nom complet" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Adresse Email</label>
              <input type="email" class="form-control" id="email" placeholder="Votre email" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <input type="password" class="form-control" id="password" placeholder="Mot de passe" required>
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
              <input type="password" class="form-control" id="confirmPassword" placeholder="Confirmez votre mot de passe" required>
            </div>
            <button type="submit" class="btn btn-success w-100">S'inscrire</button>
          </form>
        </div>
        <div class="card-footer text-center">
          <small>Déjà un compte ? <a routerLink="/signIn">Connectez-vous</a></small>
        </div>
      </div>
    </div>
  </div>
</div>
