<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>

  <nav id="navbar" class="navbar navbar-expand-lg bg-body-tertiaryPas fixed-top border-bottom" >
    <div class="container-fluid" >
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <img src="/assets/images/icones/billy-ecole.jpg" class="rounded-circle ms-3" width="30" height="30" alt="Logo Billy-ecole">
      <a id="navbar-brand" class="navbar-brand text-vert ms-2" href="#">Billy Ecole</a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="#" appScrollSpyActive="">Accueil</a>
          </li>
          <li class="nav-item">
            <a class="nav-link"  routerLink="/historiqueBilly"  routePath="/historiqueBilly">A propos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/nosCours" routePath="/nosCours">Cours</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#meilleursEleve" appScrollSpyActive="meilleursEleve">Nos Meilleurs</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#activite" id="nav-link" appScrollSpyActive="activite">Acivités</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#frais" id="nav-link" appScrollSpyActive="frais">Frais Scolaire</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#event" id="nav-link" appScrollSpyActive="event">Événements</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#contact" appScrollSpyActive="contact">Contact</a>
          </li>
        </ul>

        <div class="gap-4 d-flex " style="color: green;">
          <a *ngIf="!user" routerLink="/signIn" class="btn  btn-outline-success  rounded-4 p-2 border-danger" id="btn" style="font-size: 0.9rem;">
            Connectez-vous <i class="fas fa-arrow-right ms-2"></i>
          </a>
          <a    *ngIf=" user && user?.role=='enseignant'" (click)="secureRouteService.navigateTo('/enseignant')" class="btn btn1 btn-outline-success rounded-4 p-2 border-danger bg-vert text-vert">
            <i class="fas fa-sign-out-alt text-vert me-2"></i> Enseignant
          </a>
          <a    *ngIf=" user && user?.role=='admin'" (click)="secureRouteService.navigateTo('/admin')" class="btn btn1 btn-outline-success rounded-4 p-2 border-danger bg-vert text-vert">
            <i class="fas fa-sign-out-alt text-vert me-2"></i> Administrer
          </a>
          <a    *ngIf=" user && user?.role=='eleve'" (click)="secureRouteService.navigateTo('/eleve')" class="btn btn1 btn-outline-success rounded-4 p-2 border-danger bg-vert text-vert">
            <i class="fas fa-sign-out-alt text-vert me-2"></i> Eleve
          </a>
         </div>
      </div>
    </div>
  </nav>

</body>
</html>
