

<main class="container-fluid bg-vertT" >

  <app-header-visiteur></app-header-visiteur> <!-- Pagination haut -->



  <section class="row bg-white " style="margin-top: 4rem;">
    <div class="col-12 col-md-9 bg-light">
      <nav>
        <ul class="pagination justify-content-center mt-4">
            <li class="page-item"><a href="#" class="page-link text-vert">&laquo;</a></li>
            <li class="page-item"><a href="#" class="page-link page-active text-rouge">1</a></li>
            <li class="page-item"><a href="#" class="page-link text-rouge">2</a></li>
            <li class="page-item"><a href="#" class="page-link text-rouge">3</a></li>
            <li class="page-item"><a href="#" class="page-link disabled text-vert">&raquo;</a></li>
        </ul>
    </nav>
      <div class="list-group list-group-flush">
        <article class="list-group-item mb-3" *ngFor="let matiere of matieres">
          <div class="row">
            <div class="col-12 col-md-4 d-noneE d-md-block bg-rougeTP rounded-2">
              <img [src]="matiere.image" class="img-thumbnail  img-fluid" [alt]="matiere.titre">
            </div>
            <div class="col-12 col-md-8 bg-rougeTp rounded-2">
              <h1 class="text-whiteP text-vert mt-2">{{ matiere.titre }}</h1>
              <p>{{ matiere.description }}</p>
              <a [routerLink]="matiere.lien" class="btn learn-more-btn text-rouge mb-3">Lire la suite</a>
            </div>
          </div>
        </article>
      </div>

      <nav>
        <ul class="pagination justify-content-center nav-pills">
          <li class="page-item mt-20"><a href="#" class="page-link text-vert">&laquo;</a></li>
          <li class="page-item mt-20"><a href="#" class="page-link active text-white" style="background-color: #2ecc71; border-color: #2ecc71;">1</a></li>
          <li class="page-item mt-20"><a href="#" class="page-link text-vert">2</a></li>
          <li class="page-item mt-20"><a href="#" class="page-link text-vert">3</a></li>
          <li class="page-item mt-20"><a href="#" class="page-link disabled text-vert">&raquo;</a></li>
        </ul>
      </nav>
    </div>

    <div class="col-12 col-md-3 mt-4 bg-light">
      <section class="card">
        <div class="card-header bg-vert text-white">
          <h1 class="h5">Catégories</h1>
        </div>
        <ul class="list-group">
          <li class="list-group-item list-group-action d-flex  justify-content-between align-items-center" *ngFor="let matiere of matieres">
            <a class="text-vertP text-black" [routerLink]="matiere.lien">{{ matiere.titre }}</a>
            <span class="badge badge-primary badge-pill">1</span>
          </li>
        </ul>
      </section>
    </div>
  </section>
</main>
